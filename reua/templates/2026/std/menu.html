{% load static %}
{% load i18n %}

<header class="header" id="hdr">
    <div class="wrap">
        <a class="logo" href="#"><img src="{% static 'reua/img/2026/logo/reua-logo-light.svg' %}"
                                      alt="REUA — Rebuild Our Ukraine"></a>
        <nav class="nav">
            {% for menu_item in top_menu_items %}
                <a href="{{ menu_item.url }}">{{ menu_item.localized_title }}</a>
            {% endfor %}
        </nav>

        <div class="soc">
            <a href="#" aria-label="Facebook" class="facebook"></a>
            <a href="#" aria-label="YouTube" class="youtube"></a>
            <a href="#" aria-label="Instagram" class="instagram"></a>
            <a href="#" aria-label="LinkedIn" class="linkedin"></a>
        </div>

        <div class="lang">
            {% get_available_languages as languages %}
            {% for language in languages %}
                {% get_language_info for language|first as lang_info %}
                <a class="{% if LANGUAGE_CODE == lang_info.code %}on{% endif %}"
                   href="{% language lang_info.code %}{% url "index" %}{% endlanguage %}">{{ language|last|upper }}</a>
            {% endfor %}
        </div>
    </div>
</header>
